[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-jobs-board"
version = "0.1.0"
description = "Autumn recruiting job board and candidate resume service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "reportlab>=4.2,<5",
  "pypdf>=4,<7",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["config.json"]
